; Digital Smart Class — PHP runtime tuning for large media uploads.
; Loaded by the Docker image and (optionally) the local built-in server.
; Raised limits so teachers can upload real course videos.

upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; Keep common defaults explicit for production.
file_uploads = On
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Africa/Kigali

; Session hardening (also enforced in config/database.php).
session.cookie_httponly = 1
session.use_strict_mode = 1
